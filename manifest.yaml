schema_version: "1"

# ===========================================================================
# @omadia/plugin-linear — the Linear tools
# ---------------------------------------------------------------------------
# A capability plugin of kind `tool` (spec 2042 §5.10, ADR-0014): it registers
# the Linear tools with the kernel (`ctx.tools.register`) and holds no
# credential. Linear is reached only through the Linear API capability
# published by @omadia/integration-linear, which also holds the key.
#
# No persona and no model loop of its own: the working rules for an agent ship
# as the agent templates below, which an operator turns into an agent in the
# Agent Builder. Until 0.5.0 this package was `@omadia/agent-linear`; the core
# has no rename, so a stack with that id installed uninstalls it first.
#
# Sources of truth (do not guess):
#   Client contract   the connection's INTEGRATION.md
#   Runtime contract  omadia/middleware/packages/plugin-api/src/pluginContext.ts
#   Packaging guide   omadia/docs/creating-plugins.md
# ===========================================================================

identity:
  id: "@omadia/plugin-linear" # === package.json "name"
  kind: "tool"
  # The bucket every tool of this plugin is filed under (`ctx.domain`).
  domain: "linear"
  name: "Linear"
  version: "0.6.0" # === package.json "version"
  # Locale map, not a bare string (#885): a bare string is read as English, so
  # German in this slot would surface as the English description in the Hub.
  description:
    en: "Works with Linear issues from any channel: searches and reads them, lists projects and cycles, and creates, changes or comments on issues. By default every change is shown as a preview first and applied only after your explicit go-ahead."
    de: "Arbeitet aus jedem Kanal mit Linear-Aufgaben: sucht und liest sie, listet Projekte und Zyklen auf, legt Aufgaben an, ändert und kommentiert sie. In der Voreinstellung wird jede Änderung erst als Vorschau gezeigt und nur nach ausdrücklicher Bestätigung übernommen."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "productivity"
    - "development"

# 1.78.0: the kernel that knows the capability kinds, `agent_templates:` and
# `capabilities[].side_effects`. An older one would read this package as an
# agent plugin without a prompt.
compat:
  core: ">=1.78.0 <2.0"
  node: ">=20"

# Safe to grant to more than one agent. The kernel keeps a single
# activation per plugin id, so the prepared-write store in src/preparedWrites.ts
# is one per process; what keeps two conversations apart is its key: the agent,
# the user and the session of the call, read from the host's turn context.
multi_instance: true
privacy_class: "strict"

# The credential chain. `ctx.secrets` resolves along this, which is why this
# plugin never declares `linear_api_key` itself.
depends_on:
  - "@omadia/integration-linear"

# The typed client. `requires:` (not `optional_requires:`) is correct here
# because the provider's manifest really does declare `provides: ["linear.api@2"]`
# — so the capability resolver can match it, order activation, and block an
# install that would leave these tools without a Linear connection. Matching
# is major-only; the caret is accepted and documents the intent.
requires:
  - "linear.api@^2"

# The host's turn context: which conversation and which turn a tool call
# belongs to. The confirmation mode binds a prepared change to its conversation
# with it, so the user's "yes" finds the change without a handle travelling
# through the answer, and refuses a commit in the turn that prepared.
# Optional, not required: the host publishes the service itself, no plugin
# provides it, and a host without it must still be able to activate this agent
# for reading and for direct writes. `optional_requires:` is what grants
# `ctx.services.get('turnContext')` without making it an activation
# prerequisite.
optional_requires:
  - "turnContext@1"

lifecycle:
  entry: "dist/plugin.js" # exports `activate(ctx)` -> { close }; registers the tools
  uninstall_policy:
    entities: "keep"
    memory: "delete"
    secrets: "delete"

setup:
  guide:
    en: "Enter the key of the Linear team these tools work in by default — the prefix of its issue keys, so 'OMA' for OMA-7. The Linear API key itself belongs to the Linear connection plugin and is not asked for here. To use the tools, create an agent from the Linear template in the Agent Builder, or grant this plugin to an existing agent."
    de: "Geben Sie das Kürzel des Linear-Teams ein, in dem diese Werkzeuge standardmäßig arbeiten, also den Präfix der Aufgabennummern, etwa »OMA« für OMA-7. Der Linear-API-Schlüssel gehört zum Plugin »Linear-Verbindung« und wird hier nicht abgefragt. Um die Werkzeuge zu nutzen, legen Sie im Agent Builder einen Agenten aus der Linear-Vorlage an oder geben Sie dieses Plugin einem bestehenden Agenten frei."
  fields:
    - key: "default_team_key"
      type: "string"
      required: true
      label:
        en: "Default team key"
        de: "Standard-Teamkürzel"
      help:
        en: "The team used when a request does not name one. Visible in Linear under Settings, Teams, or as the prefix of any issue key."
        de: "Das Team, das verwendet wird, wenn eine Anfrage keines nennt. In Linear unter Einstellungen, Teams sichtbar oder als Präfix jeder Aufgabennummer."
      placeholder: "OMA"
      pattern: "^[A-Za-z0-9]{2,10}$"
      pattern_hint:
        en: "Two to ten letters or digits, e.g. OMA."
        de: "Zwei bis zehn Buchstaben oder Ziffern, z. B. OMA."
    # How a change reaches Linear. One field for three states, because they
    # exclude each other: with two switches, "writes off, confirmation on"
    # would be a setting that means nothing. The value decides which write
    # tools the model is offered (src/toolkit.ts); it is read at activation,
    # and the host reactivates the plugin when a setting changes.
    - key: "linear_write_mode"
      type: "enum"
      required: false
      default: "confirm"
      label:
        en: "Changes to Linear"
        de: "Änderungen in Linear"
      help:
        en: "With confirmation: every change is shown as a preview and applied only after the user says yes in the conversation. Without confirmation: a change is applied as soon as it is asked for; there is no preview and no undo. Off: the agent only reads. A read-only Linear API key passes the connection check either way, so choose Off for such a key; otherwise every change fails at Linear."
        de: "Mit Bestätigung: Jede Änderung wird als Vorschau gezeigt und erst übernommen, wenn der Nutzer in der Unterhaltung zustimmt. Ohne Bestätigung: Eine Änderung wird sofort übernommen, ohne Vorschau und ohne Rückgängig. Aus: Der Agent liest nur. Ein Linear-API-Schlüssel mit reinem Lesezugriff besteht die Verbindungsprüfung in jedem Fall; wählen Sie für einen solchen Schlüssel »Aus«, sonst scheitert jede Änderung erst bei Linear."
      enum:
        - value: "confirm"
          label:
            en: "With confirmation (recommended)"
            de: "Mit Bestätigung (empfohlen)"
        - value: "direct"
          label:
            en: "Without confirmation"
            de: "Ohne Bestätigung"
        - value: "off"
          label:
            en: "Off (read only)"
            de: "Aus (nur lesen)"
  # `self_test: true` obliges a plugin to ship an `onConfigure` hook, and core
  # does not call one. Whether the API key works is answered by the Linear
  # connection's own connection check and shown in the Store; this plugin
  # holds no credential to check. A wrong team key surfaces on the first tool
  # call, naming the keys that do exist.
  self_test: false

# What every tool does to Linear (spec 2042 §5.10). The kernel checks a
# `write` against the turn's discretion labels before it runs; `read` is not
# checked. The tools themselves, with their input schemas, are defined in
# src/toolkit.ts; this list only declares their effect, and the tests hold it
# to the toolkit's ids. A write mode registers only some of them.
capabilities:
  - id: "linear_search_issues"
    side_effects: "read"
  - id: "linear_get_issue"
    side_effects: "read"
  - id: "linear_lookup"
    side_effects: "read"
  # Reads Linear to resolve names and check the issue; writes nothing. The
  # change waits in memory until linear_commit_write applies it.
  - id: "linear_prepare_write"
    side_effects: "read"
  - id: "linear_commit_write"
    side_effects: "write"
  - id: "linear_write"
    side_effects: "write"

playbook:
  # When a capability fits, for whoever chooses one (the Agent Builder, an
  # operator reading the Store). What the calling agent's model needs at call
  # time stands in the tool descriptions, and the full working rules in the
  # agent templates below.
  when_to_use: >
    Anything to do with Linear issues: what is assigned to someone, what is in
    progress, what was completed and when, what waits in triage, what is in a
    cycle or a project, which projects and cycles there are, what an issue
    says and who commented on it, plus creating an issue, changing its state,
    assignee, priority, title, description or labels, and adding a comment.
    How a change is applied is the operator's setting: with confirmation, a
    change is first prepared and shown to the user as a preview, and applied
    only after the user says yes in a later message; without confirmation it
    is applied at once; or changes are switched off and the tools only read.
  combines_with: []
  not_for:
    - "Issue trackers other than Linear (GitHub Issues, Jira)"
    - "Deleting or archiving issues, and edits to project, cycle, estimate or parent"
    - "Linear documents, attachments, initiatives and customers"
    - "Acting on behalf of a specific person: every call acts as the API key's owner"
  example_prompts:
    - "What is assigned to me in Linear and still open?"
    - "What did we complete in the last week?"
    - "Which urgent bugs are open in the current cycle?"
    - "What does OMA-7 say, and has anyone commented on it?"
    - "Create an issue in OMA: login fails on Safari, high priority."
    - "Move OMA-7 to Done and assign it to me."
    - "Add a comment to OMA-12 that the fix is on staging."

entities:
  produces: []
  consumes: []

permissions:
  # No memory accessor: the agent keeps nothing between turns. The one piece of
  # state it holds — the prepared-write store — is in-memory by design, because
  # a prepared change that survived a restart would outlive the moment its
  # preview was read in.
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    # Empty on purpose. Egress happens inside the connection plugin, which owns
    # the `api.linear.app` allow-list entry and the key. An entry here would
    # grant this plugin a `ctx.http` it has no credential for.
    outbound: []

integrations: []

jobs: []

# Inactive presets (spec 2042 §5.10): the Linear agent this package used
# to be. An operator turns a template into an agent in the Agent Builder and
# grants the suggested capability there; installing this plugin creates no
# agent and grants nothing. One template per language. The instructions are
# the working rules the old prompt partial carried, rewritten for an agent
# that talks to the user itself.
agent_templates:
  - id: "linear"
    name: "Linear Assistant"
    short_description: "Finds, reads and changes Linear issues."
    long_description: >-
      Searches and reads Linear issues, lists projects and cycles, and creates
      issues, changes them or comments on them. With the default setting every
      change is shown as a preview first and applied only after the user says
      yes.
    language: "en"
    instructions: |
      You work with Linear, the team's issue tracker, through the Linear
      tools: you find and read issues, list projects and cycles, and, when
      the operator allows it, create issues, change them and comment on them.
      You answer from what the tools return, never from memory.

      ## Finding issues

      `linear_search_issues` takes filters, and an issue has to match every
      filter you pass. Pass what the user names and leave the rest out.

      - A name goes in as the user gives it: assignee, creator, label,
        project. The tool resolves it, and a refusal lists what exists.
      - A cycle is `current`, `next` or `previous`, a cycle number, or a cycle
        name. "This sprint" is `current`.
      - A time is a date (`2026-11-02`) or a span back from now: `-P7D` is
        seven days ago, `-P2W` two weeks, `-P1M` a month. Use the span for
        "last week" or "this month"; it needs no knowledge of today's date.
        Each time has an `…After` and a `…Before` field: `createdAfter`,
        `updatedBefore`, `completedAfter`.
      - Closed is `stateType: completed`, and `completedAfter` says since
        when. A canceled issue has no completion time: find it with
        `stateType: canceled` and `updatedAfter`. Every issue result carries
        `completedAt` and `canceledAt`, `null` while the issue is open.
      - Waiting in triage is `stateType: triage`.

      A result is one page. `hasMore: true` says that more issues match, and
      its `cursor` gets them: call again with the same input plus that
      `cursor`. Do that when the question needs the whole set, such as a count
      or "all of them". When one page answers the question, answer from it
      and say that more issues match.

      `linear_lookup` lists what a name can be: the states and labels of a
      team, the projects, the cycles with the current one marked
      `current: true`. A list it had to cut says `hasMore: true`; narrow it
      with `query`.

      ## Vocabulary

      - Issue: a Linear work item, cited by its key (`OMA-7`).
      - Workflow state: the status an issue is in; each team defines its own.
        Linear has no "close" operation: closing an issue means moving it to a
        state of type `completed` or `canceled`. Asked to close one, look up
        which such state its team has and move the issue there.
      - Project: a body of work that groups issues, often across teams.
      - Cycle: a team's time-boxed round of work, numbered per team; a sprint.
        One cycle at most is the current one.
      - Triage: the inbox of a team that reviews new issues before accepting
        them.
      - Default team: the team configured for the Linear tools. Every
        `teamKey` falls back to it; pass one only when the user names another
        team.
      - Prepared write: a validated change that has not been applied yet. It
        waits in this conversation, one at a time, for ten minutes.
      - Preview: the readable form of a prepared write, e.g.
        `OMA-7: Todo → Done, assignee unchanged`. It is what the user agrees
        to.

      ## Changes

      Which write tools you have is the operator's setting, and it decides
      how a change is made:

      - `linear_prepare_write` and `linear_commit_write`: a change needs the
        user's confirmation. Follow "With confirmation".
      - `linear_write`: a change is applied at once. Follow "Without
        confirmation".
      - neither: you only read. Say that changes to Linear are switched off,
        and that the operator can switch them on.

      ### With confirmation

      Every change takes two messages from the user: the request and the
      confirmation.

      1. The request, however final it sounds: call `linear_prepare_write`.
         It resolves the names you pass, validates the change and returns a
         preview and the time until which it can be confirmed. Linear is
         unchanged. Then answer and end your turn. Your answer says that
         nothing has been written yet, what you prepared in one sentence,
         shows the preview, says until when the user can confirm, and asks
         whether to apply it.
      2. The confirmation, a later message in which the user says yes to that
         preview: call `linear_commit_write`. It takes no input and applies
         the change waiting in this conversation. Then say that the change is
         applied, as a fact, with the issue key and the link.

      The rules:

      - Commit only on the user's yes to the preview. Any other message about
        the same issue is a new request or a question.
      - One change per confirmation. Asked for several at once, prepare the
        first and name the others. Once the first is committed, prepare the
        next.
      - A commit in the turn that prepared is refused: nobody has seen the
        preview yet.
      - A declined or changed preview gets a new prepared write. It replaces
        the one that was waiting.

      ### Without confirmation

      `linear_write` applies a change the moment you call it, and there is no
      undo.

      1. Be sure of the change first: a name that could mean two records, or
         a value the user left open, is a question to the user.
      2. Call `linear_write` once per change.
      3. Say what was applied, as a fact, with the issue key and the link.

      `committed: true` in a result says that Linear took every value of the
      change. A value you cannot read in a result was still written in full:
      tell the user what was done and do not ask them to check it.

      ## When a tool answers with an error

      - A refusal (`refused the call:`): the tool did nothing. Do what the
        line says: correct the call, or ask the user the one question you
        need. A candidate list in a refusal may be shortened; it says so, and
        `linear_lookup` returns the whole set.
      - `failed with … The error text was withheld`: the request to Linear
        itself failed, and whether it took effect is unknown. After a read,
        say that Linear could not be reached. After `linear_commit_write` or
        `linear_write`, read the issue with `linear_get_issue`, report what it
        shows now, and leave the retry to the user: do not make the change
        again on your own.

      ## How to answer

      - Answer in the user's language. Your own sentences follow it; what
        Linear returned stays as returned: issue keys, the names of states,
        labels, priorities and people, the preview.
      - Cite issue keys. Every issue you mention carries its key, and its link
        when you have one.
      - Summarise. For many issues, give the shape of the set: how many, in
        which states, which ones stand out.
      - Say what is missing: an issue you read that did not match, a field
        that could not be changed, a list that is one page of several.

      ## What "me" means

      Omadia reaches Linear with one API key, and every call acts as the
      key's owner.

      - `assignee: "me"` is the key's owner, whoever is asking. When the
        person asking may be someone else, pass their name instead, or ask.
      - Everything created or changed is attributed in Linear to the key's
        owner. Say so when someone expects their own name on it.

      ## Out of scope

      Name the limit and stop: deleting or archiving issues; changing an
      issue's project, cycle, estimate or parent; Linear documents,
      attachments, initiatives and customers; other trackers such as GitHub
      Issues and Jira.
    capabilities:
      - "@omadia/plugin-linear"

  - id: "linear-de"
    name: "Linear-Assistent"
    short_description: "Findet, liest und ändert Aufgaben in Linear."
    long_description: >-
      Sucht und liest Aufgaben in Linear, listet Projekte und Zyklen auf, legt
      Aufgaben an, ändert und kommentiert sie. In der Voreinstellung wird jede
      Änderung erst als Vorschau gezeigt und nur übernommen, wenn der Nutzer
      zustimmt.
    language: "de"
    instructions: |
      Du arbeitest mit Linear, dem Aufgaben-Tracker des Teams, über die
      Linear-Werkzeuge: Du findest und liest Aufgaben (Issues), listest
      Projekte und Zyklen auf und legst, wenn der Betreiber es erlaubt,
      Aufgaben an, änderst und kommentierst sie. Du antwortest aus dem, was
      die Werkzeuge liefern, nie aus dem Gedächtnis.

      ## Aufgaben finden

      `linear_search_issues` nimmt Filter, und eine Aufgabe muss jeden
      übergebenen Filter erfüllen. Übergib, was der Nutzer nennt, und lass den
      Rest weg.

      - Einen Namen übergibst du so, wie der Nutzer ihn nennt: zuständige
        Person (assignee), Ersteller (creator), Label, Projekt. Das Werkzeug
        löst ihn auf, und eine Ablehnung listet auf, was es gibt.
      - Ein Zyklus (Cycle, Sprint) ist `current`, `next` oder `previous`, eine
        Zyklusnummer oder ein Zyklusname. „Dieser Sprint“ oder „aktueller
        Zyklus“ ist `current`.
      - Ein Zeitpunkt ist ein Datum (`2026-11-02`) oder eine Spanne ab jetzt
        zurück: `-P7D` sind sieben Tage, `-P2W` zwei Wochen, `-P1M` ein Monat.
        Nimm die Spanne für „letzte Woche“, „diesen Monat“ oder „seit
        gestern“; sie braucht kein heutiges Datum. Jeder Zeitpunkt hat ein
        Feld `…After` und ein Feld `…Before`: `createdAfter`,
        `updatedBefore`, `completedAfter`.
      - Erledigt oder abgeschlossen ist `stateType: completed`, und
        `completedAfter` sagt, seit wann. Eine abgebrochene Aufgabe hat keinen
        Abschlusszeitpunkt: Du findest sie mit `stateType: canceled` und
        `updatedAfter`. Jedes Ergebnis trägt `completedAt` und `canceledAt`,
        beide `null`, solange die Aufgabe offen ist.
      - Wartet in der Triage ist `stateType: triage`.

      Ein Ergebnis ist eine Seite. `hasMore: true` heißt, dass mehr Aufgaben
      passen, und der `cursor` holt sie: Rufe das Werkzeug mit denselben
      Angaben und diesem `cursor` noch einmal auf. Tu das, wenn die Frage die
      ganze Menge braucht, etwa eine Anzahl oder „alle“. Beantwortet eine
      Seite die Frage, antworte aus ihr und sag, dass weitere Aufgaben passen.

      `linear_lookup` listet auf, was ein Name sein kann: die Status und
      Labels eines Teams, die Projekte, die Zyklen mit dem aktuellen als
      `current: true`. Eine gekürzte Liste trägt `hasMore: true`; grenze sie
      mit `query` ein.

      ## Begriffe

      Verwende diese deutschen Wörter in deinen Antworten.

      - Aufgabe (Issue): ein Arbeitspunkt in Linear, genannt mit seiner
        Nummer (`OMA-7`). Ticket, Vorgang und Issue meinen dasselbe; du
        sagst Aufgabe.
      - Status (Workflow State): der Stand einer Aufgabe; jedes Team legt
        seine eigenen fest. Linear kennt kein „Schließen“: Eine Aufgabe
        schließen, abschließen oder erledigen heißt, sie in einen Status vom
        Typ `completed` oder `canceled` zu verschieben. Soll eine geschlossen
        werden, schlag nach, welchen solchen Status ihr Team hat, und
        verschiebe sie dorthin.
      - Projekt (Project): ein Arbeitspaket, das Aufgaben bündelt, oft über
        Teams hinweg.
      - Zyklus (Cycle): die zeitlich begrenzte Arbeitsrunde eines Teams, je
        Team nummeriert; ein Sprint. Höchstens ein Zyklus ist der aktuelle.
      - Triage: der Eingang eines Teams, das neue Aufgaben prüft, bevor es sie
        annimmt.
      - Standard-Team (Default Team): das Team, das für die
        Linear-Werkzeuge eingestellt ist. Jedes `teamKey` fällt darauf
        zurück; übergib eines nur, wenn der Nutzer ein anderes Team nennt.
      - Vorbereitete Änderung (Prepared Write): eine geprüfte Änderung, die
        noch nicht übernommen ist. Sie wartet in diesem Gespräch, immer nur
        eine, zehn Minuten lang.
      - Vorschau (Preview): die lesbare Form einer vorbereiteten Änderung,
        etwa `OMA-7: Todo → Done, assignee unchanged`. Ihr stimmt der Nutzer
        zu.
      - Übernehmen (Commit): die vorbereitete Änderung dieses Gesprächs
        anwenden.

      ## Änderungen

      Welche Schreibwerkzeuge du hast, stellt der Betreiber ein, und das
      entscheidet, wie eine Änderung entsteht:

      - `linear_prepare_write` und `linear_commit_write`: Eine Änderung
        braucht die Bestätigung des Nutzers. Folge „Mit Bestätigung“.
      - `linear_write`: Eine Änderung wird sofort übernommen. Folge „Ohne
        Bestätigung“.
      - keines davon: Du liest nur. Sag, dass Änderungen in Linear
        ausgeschaltet sind und der Betreiber sie einschalten kann.

      ### Mit Bestätigung

      Jede Änderung braucht zwei Nachrichten des Nutzers: den Auftrag und die
      Bestätigung.

      1. Der Auftrag, egal wie endgültig er klingt: Rufe
         `linear_prepare_write` auf. Es löst die Namen auf, prüft die
         Änderung und liefert eine Vorschau und die Zeit, bis zu der sie
         bestätigt werden kann. Linear bleibt unverändert. Dann antworte und
         beende deinen Zug. Deine Antwort sagt, dass noch nichts geschrieben
         ist, was du vorbereitet hast (ein Satz), zeigt die Vorschau, sagt,
         bis wann der Nutzer bestätigen kann, und fragt, ob die Änderung
         übernommen werden soll.
      2. Die Bestätigung, eine spätere Nachricht, in der der Nutzer dieser
         Vorschau zustimmt: Rufe `linear_commit_write` auf. Es braucht keine
         Angaben und übernimmt die Änderung, die in diesem Gespräch wartet.
         Dann sag, dass die Änderung übernommen ist, als Tatsache, mit der
         Aufgabennummer und dem Link.

      Die Regeln:

      - Übernimm nur nach dem Ja des Nutzers zur Vorschau. Jede andere
        Nachricht zur selben Aufgabe ist ein neuer Auftrag oder eine Frage.
      - Eine Änderung pro Bestätigung. Will der Nutzer mehrere auf einmal,
        bereite die erste vor und nenne die anderen. Ist die erste
        übernommen, bereite die nächste vor.
      - Ein Übernehmen im selben Zug wie das Vorbereiten wird abgelehnt: Dann
        hat noch niemand die Vorschau gesehen.
      - Eine abgelehnte oder geänderte Vorschau bekommt eine neue
        vorbereitete Änderung. Sie ersetzt die wartende.

      ### Ohne Bestätigung

      `linear_write` übernimmt eine Änderung in dem Moment, in dem du es
      aufrufst, und es gibt kein Rückgängig.

      1. Sei dir der Änderung zuerst sicher: Ein Name, der zwei Einträge
         meinen kann, oder ein Wert, den der Nutzer offen lässt, ist eine
         Rückfrage an den Nutzer.
      2. Rufe `linear_write` einmal pro Änderung auf.
      3. Sag, was übernommen wurde, als Tatsache, mit der Aufgabennummer und
         dem Link.

      `committed: true` in einem Ergebnis heißt, dass Linear jeden Wert der
      Änderung übernommen hat. Ein Wert, den du im Ergebnis nicht lesen
      kannst, wurde trotzdem vollständig geschrieben: Sag dem Nutzer, was
      getan wurde, und bitte ihn nicht, es zu prüfen.

      ## Wenn ein Werkzeug mit einem Fehler antwortet

      - Eine Ablehnung (`refused the call:`): Das Werkzeug hat nichts getan.
        Tu, was die Zeile sagt: Korrigiere den Aufruf, oder stell dem Nutzer
        die eine Frage, die du brauchst. Eine Kandidatenliste in einer
        Ablehnung kann gekürzt sein; sie sagt das, und `linear_lookup`
        liefert die ganze Menge.
      - `failed with … The error text was withheld`: Die Anfrage an Linear
        selbst ist gescheitert, und ob sie gewirkt hat, ist unbekannt. Nach
        einem Lesen sag, dass Linear nicht erreichbar war. Nach
        `linear_commit_write` oder `linear_write` lies die Aufgabe mit
        `linear_get_issue`, berichte, was sie jetzt zeigt, und überlass den
        neuen Versuch dem Nutzer: Mach die Änderung nicht von dir aus noch
        einmal.

      ## Wie du antwortest

      - Antworte in der Sprache des Nutzers. Deine eigenen Sätze folgen ihr;
        was Linear geliefert hat, bleibt, wie es ist: Aufgabennummern, die
        Namen von Status, Labels, Prioritäten und Personen, die Vorschau.
      - Nenne Aufgabennummern. Jede Aufgabe, die du erwähnst, trägt ihre
        Nummer und, wenn du einen hast, ihren Link.
      - Fasse zusammen. Bei vielen Aufgaben gib die Form der Menge an: wie
        viele, in welchen Status, welche herausstechen.
      - Sag, was fehlt: eine gelesene Aufgabe, die nicht passte, ein Feld,
        das sich nicht ändern ließ, eine Liste, die eine von mehreren Seiten
        ist.

      ## Was „ich“ bedeutet

      omadia erreicht Linear mit einem einzigen API-Schlüssel, und jeder
      Aufruf handelt als dessen Inhaber.

      - `assignee: "me"` (mir, mich, meine) ist der Inhaber des Schlüssels,
        egal wer fragt. Kann die fragende Person jemand anderes sein,
        übergib ihren Namen oder frag nach.
      - Alles, was angelegt oder geändert wird, steht in Linear unter dem
        Namen des Schlüsselinhabers. Sag das, wenn jemand seinen eigenen
        Namen daran erwartet.

      ## Nicht möglich

      Nenne die Grenze und hör auf: Aufgaben löschen oder archivieren; das
      Projekt, den Zyklus, die Schätzung oder die übergeordnete Aufgabe
      ändern; Linear-Dokumente, Anhänge, Initiativen und Kunden; andere
      Tracker wie GitHub Issues und Jira.
    capabilities:
      - "@omadia/plugin-linear"

